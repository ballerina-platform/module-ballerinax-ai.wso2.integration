plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

description = 'Ballerina - ai.wso2.integration Compiler Plugin'

configurations {
    // Bundled into the shaded jar. ballerina-lang/parser/tools-api are provided by the Ballerina
    // distribution at plugin-load time and must stay off the module path here.
    fatJar {
        extendsFrom implementation
        exclude group: 'org.ballerinalang'
    }
}

dependencies {
    implementation group: 'org.ballerinalang', name: 'ballerina-lang', version: "${ballerinaLangVersion}"
    implementation group: 'org.ballerinalang', name: 'ballerina-parser', version: "${ballerinaLangVersion}"
    implementation group: 'org.ballerinalang', name: 'ballerina-tools-api', version: "${ballerinaLangVersion}"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

compileJava {
    doFirst {
        options.compilerArgs = ['--module-path', classpath.asPath]
        classpath = files()
    }
}

shadowJar {
    configurations = [project.configurations.fatJar]
    archiveClassifier = ''
    // The shaded jar is loaded as a plain classpath jar, not a Java module; a bundled
    // module-info.class would only cause a duplicate-entry clash.
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'
}

jar {
    enabled = false
    dependsOn(shadowJar)
}
